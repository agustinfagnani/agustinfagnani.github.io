<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --text: #1c1917;
    --muted: #57534e;
    --border: #e7e5e4;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --placeholder: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09;
      --surface: #1c1917;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #292524;
      --accent: #2dd4bf;
      --accent-soft: #134e4a;
      --placeholder: #292524;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09;
    --surface: #1c1917;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --border: #292524;
    --accent: #2dd4bf;
    --accent-soft: #134e4a;
    --placeholder: #292524;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  a { color: var(--accent); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 12px; }
  nav .brand { font-weight: 700; text-decoration: none; color: var(--text); white-space: nowrap; }
  nav .links { display: flex; gap: 18px; align-items: center; font-size: 15px; }
  nav .links a { color: var(--muted); text-decoration: none; }
  nav .links a:hover { color: var(--text); }
  .lang {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer;
  }
  @media (max-width: 640px) { nav .links a { display: none; } }

  /* Hero */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; padding-top: 64px; padding-bottom: 48px; }
  .hero h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.15; margin: 0 0 16px; letter-spacing: -0.02em; }
  .hero p.lead { font-size: 18px; color: var(--muted); margin: 0 0 24px; max-width: 560px; }
  .hero img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 4px solid var(--surface); box-shadow: 0 4px 24px rgb(0 0 0 / 0.12); }
  .cta { display: inline-block; background: var(--accent); color: var(--bg); padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 32px; }
  .stats div strong { display: block; font-size: 22px; }
  .stats div span { font-size: 14px; color: var(--muted); }
  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; padding-top: 40px; }
    .hero img { width: 120px; height: 120px; order: -1; }
  }

  section { padding: 48px 0; border-top: 1px solid var(--border); }
  section h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.01em; }
  section p.sub { color: var(--muted); margin: 0 0 28px; }

  /* Servicios */
  .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .service { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .service h3 { margin: 0 0 6px; font-size: 17px; }
  .service p { margin: 0; color: var(--muted); font-size: 15px; }

  /* Casos */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filters button {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer;
  }
  .filters button.active { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
  .cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .case {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; color: inherit; font: inherit;
    transition: transform .15s, box-shadow .15s;
  }
  .case:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgb(0 0 0 / 0.08); }
  .case .body { padding: 16px 18px 18px; }
  .case .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
  .case h3 { margin: 4px 0 8px; font-size: 17px; line-height: 1.3; }
  .case p { margin: 0; color: var(--muted); font-size: 14px; }

  .shot { aspect-ratio: 16 / 10; width: 100%; background: var(--placeholder); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; }
  .shot .ph { font-size: 13px; color: var(--muted); padding: 12px; text-align: center; border: 2px dashed var(--border); border-radius: 8px; margin: 12px; }

  /* Detalle */
  dialog {
    border: none; border-radius: 16px; padding: 0; max-width: 760px; width: calc(100% - 32px);
    background: var(--surface); color: var(--text); max-height: 90vh;
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.55); }
  dialog .inner { padding: 28px; }
  dialog .close { position: sticky; top: 0; float: right; margin: 12px; border: none; background: var(--placeholder); color: var(--text); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  dialog h3 { font-size: 22px; margin: 4px 0 4px; line-height: 1.25; }
  dialog .client { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  dialog h4 { margin: 22px 0 6px; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  dialog ul { margin: 0; padding-left: 20px; }
  dialog li { margin-bottom: 6px; }
  dialog .shots { display: grid; gap: 12px; margin-top: 20px; }
  dialog .shots .shot { border-radius: 10px; aspect-ratio: auto; min-height: 120px; }
  dialog .shots .shot img { height: auto; object-fit: contain; }
  .tech { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tech span { font-size: 13px; background: var(--placeholder); border-radius: 6px; padding: 3px 8px; }

  /* Sobre mí / contacto */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .about p { margin: 0 0 12px; }
  @media (max-width: 640px) { .about { grid-template-columns: 1fr; } }
  .contact-links { display: flex; gap: 12px; flex-wrap: wrap; }
  .contact-links a { border: 1px solid var(--border); background: var(--surface); padding: 10px 16px; border-radius: 8px; text-decoration: none; color: var(--text); }
  footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); }
</style>
</head>

let lang = "es";
try { lang = localStorage.getItem("lang") || (navigator.language.startsWith("es") ? "es" : "en"); } catch (e) {}
let filter = "all";

function shotHTML(caseId, n, label) {
  return `<div class="shot"><img src="img/casos/${caseId}-${n}.jpg" alt="" data-label="${label}" loading="lazy" onerror="shotMissing(this)"></div>`;
}

// Si la captura todavía no existe, se saca el recuadro: el caso se muestra sin imagen.
function shotMissing(img) {
  img.closest(".shot").remove();
}

function render() {
  document.documentElement.lang = lang;
  document.getElementById("langBtn").textContent = lang === "es" ? "EN" : "ES";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = UI[lang][el.dataset.i18n]; });

  document.getElementById("services").innerHTML = SERVICES.map(s =>
    `<div class="service"><h3>${s[lang][0]}</h3><p>${s[lang][1]}</p></div>`).join("");

  document.getElementById("scale").innerHTML = SCALE.map(s =>
    `<div class="service"><h3>${s[lang][0]}</h3><p>${s[lang][1]}</p></div>`).join("");

  const filters = [["all", UI[lang].filter_all], ...Object.entries(CATS).map(([k, v]) => [k, v[lang]])];
  document.getElementById("filters").innerHTML = filters.map(([k, label]) =>
    `<button type="button" class="${k === filter ? "active" : ""}" data-f="${k}">${label}</button>`).join("");
  document.querySelectorAll("#filters button").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

  document.getElementById("cases").innerHTML = CASES
    .filter(c => filter === "all" || c.cats.includes(filter))
    .map(c => `<button type="button" class="case" data-id="${c.id}">
        ${c.shots.length ? shotHTML(c.id, 1, c.shots[0]) : ""}
        <div class="body"><div class="tag">${c[lang].tag}</div><h3>${c[lang].title}</h3><p>${c[lang].summary}</p></div>
      </button>`).join("");
  document.querySelectorAll(".case").forEach(b => b.onclick = () => openCase(b.dataset.id));
}

function openCase(id) {
  const c = CASES.find(x => x.id === id), t = c[lang], u = UI[lang];
  const list = items => `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
  document.getElementById("detailInner").innerHTML = `
    <div class="tag" style="color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em">${t.tag}</div>
    <h3>${t.title}</h3>
    <p class="client">${t.client}</p>
    <h4>${u.d_problem}</h4>${list(t.problem)}
    <h4>${u.d_solution}</h4>${list(t.solution)}
    <h4>${u.d_result}</h4>${list(t.result)}
    <h4>${u.d_tech}</h4><div class="tech">${c.tech.map(x => `<span>${x}</span>`).join("")}</div>
    ${c.shots.length ? `<div class="shots">${c.shots.map((s, i) => shotHTML(c.id, i + 1, s)).join("")}</div>` : ""}`;
  document.getElementById("detail").showModal();
}

document.getElementById("langBtn").onclick = () => {
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
};
document.getElementById("detail").addEventListener("click", e => { if (e.target.id === "detail") e.target.close(); });

render();
</script>
